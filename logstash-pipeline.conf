# Logstash 파이프라인 (logstash-pipeline.conf)
# Filebeat로부터 로그를 수신하여 Elasticsearch로 전송

# Input: Filebeat로부터 데이터를 받는 포트를 설정합니다.
input {
  beats {
    port => 5044
    codec => "json"
  }
}

# Filter: 로그 데이터 가공
filter {
  # 메시지 필드에 JSON이 포함된 경우 파싱
  if [message] =~ /^{.*}$/ {
    json {
      source => "message"
    }
  }

  # @timestamp 필드가 없거나 잘못된 경우 현재 시간으로 설정
  if ![event][created] {
    mutate {
      add_field => { "[@timestamp]" => "%{+YYYY-MM-dd'T'HH:mm:ss.SSSZ}" }
    }
  }

  # 필드 이름 정규화
  mutate {
    rename => { "[service_name]" => "serviceName" }
    rename => { "[log_level]" => "logLevel" }
  }

  # 불필요한 필드 제거
  mutate {
    remove_field => ["@version", "agent", "ecs", "input", "host", "log", "message"]
  }
}

# Output: 가공된 데이터를 Elasticsearch로 전송
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # 인덱스명을 서비스명과 날짜를 기반으로 동적으로 설정
    index => "%{serviceName}-%{+YYYY.MM.dd}"
    # Logstash가 인덱스 템플릿을 자동으로 생성하도록 설정
    manage_template => true
    template => "/usr/share/logstash/templates/custom-template.json"
  }
}